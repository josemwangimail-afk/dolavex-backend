<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DOLAVEX V5 - FULL PRO</title>
<script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#0b0e14;color:white}
.top{display:flex;justify-content:space-between;padding:10px;background:#0b0e14;border-bottom:1px solid #1f2333;align-items:center;flex-wrap:wrap;gap:6px}
.logo{color:#00ff88;font-weight:900;font-size:18px}
.switch{display:flex;background:#1a1e2e;border-radius:20px;padding:3px}
.switch button{border:none;padding:7px 12px;border-radius:16px;font-weight:900;font-size:11px;cursor:pointer}
.real{background:#ff1744;color:white}
.demo{background:#00c853;color:white}
.inactive{background:transparent!important;color:#888!important}
.deposit{background:#00ff88;color:#000;border:none;padding:7px 14px;border-radius:20px;font-weight:900;font-size:11px;cursor:pointer}
.authBtn{background:#222;color:white;border:1px solid #333;padding:6px 12px;border-radius:20px;font-size:11px;font-weight:900;cursor:pointer}
#chart{width:100%;height:42vh;background:#0b0e14}
.panel{background:#151821;margin:8px;border-radius:16px;padding:12px;border:1px solid #222}
.row{display:flex;gap:8px}
.col{flex:1}
label{font-size:10px;color:#888;display:block;margin:6px 0 4px;text-transform:uppercase}
select,input{width:100%;background:#0b0e14;border:1px solid #2a2e45;color:white;padding:10px;border-radius:10px;font-size:13px}
.return{color:#00ff88;font-weight:bold;margin:8px 0;text-align:center;font-size:13px}
.actions{display:flex;gap:8px}
.rise{flex:1;background:#00c853;color:white;border:none;padding:14px;border-radius:12px;font-weight:900;cursor:pointer}
.fall{flex:1;background:#ff1744;color:white;border:none;padding:14px;border-radius:12px;font-weight:900;cursor:pointer}
.msg{text-align:center;padding:8px;font-weight:bold;min-height:32px;font-size:13px}
.livePrice{position:absolute;top:52px;left:8px;background:#000000cc;padding:5px 9px;border-radius:8px;z-index:5}
.timerBox{position:absolute;top:52px;right:8px;background:#ff1744;color:white;padding:8px 16px;border-radius:10px;z-index:10;font-weight:900;display:none;border:2px solid white;box-shadow:0 0 15px #ff1744}
.timerBox b{font-size:22px}
.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:#000000dd;z-index:99;display:none;align-items:center;justify-content:center}
.modalBox{background:#151821;padding:20px;border-radius:16px;width:90%;max-width:360px;border:1px solid #333}
.modalBox h3{margin-bottom:12px;color:#00ff88}
.modalBox input{margin:6px 0}
.modalBox button{width:100%;margin-top:10px;padding:12px;border:none;border-radius:10px;font-weight:900;cursor:pointer}
.dash{background:#111522;margin:8px;border-radius:16px;padding:14px;border:1px solid #222;display:none}
</style>
</head>
<body>
<div class="top">
  <div class="logo">DOLAVEX</div>
  <div style="display:flex;gap:6px;align-items:center">
    <button class="authBtn" onclick="openModal('login')">LOGIN</button>
    <button class="authBtn" style="background:#00ff88;color:#000" onclick="openModal('register')">REGISTER</button>
    <button class="authBtn" style="background:#ff1744;color:white;display:none" id="dashBtn" onclick="toggleDash()">DASHBOARD</button>
    <button class="authBtn" style="background:#222;display:none" id="logoutBtn" onclick="logout()">LOGOUT</button>
  </div>
  <div class="switch">
    <button id="realBtn" class="real inactive" onclick="setAccount('real')">REAL <span id="realBalTxt">0</span></button>
    <button id="demoBtn" class="demo" onclick="setAccount('demo')">DEMO <span id="demoBalTxt">10000</span></button>
  </div>
  <div style="color:#00ff88;font-size:11px">● $<span id="topPrice">--</span></div>
</div>

<div style="position:relative">
  <div id="chart"></div>
  <div class="livePrice"><b id="bigPrice">--</b><br><span style="font-size:10px;color:#888">Digit <b id="lastDigit" style="color:#00ff88">-</b> • <span id="accType">DEMO</span></span></div>
  <div class="timerBox" id="timerBox">⏳ <b id="countdown">5</b>s</div>
</div>

<div class="panel">
  <div class="row">
    <div class="col"><label>TRADE TYPE</label><select id="tradeType" onchange="updateUI()"><option value="risefall">Rise / Fall</option><option value="overunder" selected>Over / Under</option><option value="matches">Matches / Differs</option><option value="evenodd">Even / Odd</option></select></div>
    <div class="col"><label>DURATION</label><select id="duration"><option value="5" selected>5 sec</option><option value="10">10 sec</option><option value="30">30 sec</option><option value="60">60 sec</option></select></div>
    <div class="col"><label id="digitLabel">OVER / UNDER</label><select id="prediction" onchange="updateReturn()"><option value="OVER">Over</option><option value="UNDER">Under</option></select></div>
  </div>
  <div class="row">
    <div class="col"><label>DIGIT 0-9</label><select id="digitPick" onchange="updateReturn()"><option>0</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option selected>8</option><option>9</option></select></div>
    <div class="col"><label>STAKE 50-1500</label><input type="number" id="stake" value="100" min="50" max="1500" oninput="updateReturn()"></div>
  </div>
  <div class="return" id="returnText">Return: KES 120 (20%)</div>
  <div class="actions"><button class="rise" id="btnRise" onclick="placeTrade()">OVER</button><button class="fall" id="btnFall" onclick="placeTrade()">UNDER</button></div>
  <div class="msg" id="msg">🟢 Select digit - profit % changes!</div>
</div>

<div class="dash" id="dashboard">
  <h3 style="color:#00ff88">💼 DASHBOARD - <span id="dashPhone">--</span></h3>
  <div class="row" style="margin-top:10px">
    <div class="col" style="background:#0b0e14;padding:12px;border-radius:10px;text-align:center"><label>REAL BALANCE</label><b style="font-size:20px;color:#ff1744" id="dashReal">0</b><br><button class="deposit" onclick="stkPush()" style="margin-top:8px">📲 STK PUSH DEPOSIT</button></div>
    <div class="col" style="background:#0b0e14;padding:12px;border-radius:10px;text-align:center"><label>DEMO BALANCE</label><b style="font-size:20px;color:#00c853" id="dashDemo">10000</b></div>
  </div>
  <div style="margin-top:12px;background:#0b0e14;padding:12px;border-radius:10px">
    <label>WITHDRAW TO M-PESA</label>
    <div class="row"><div class="col"><input id="withdrawAmt" type="number" placeholder="Amount min 100"></div><div class="col"><input id="withdrawPhone" placeholder="M-Pesa 07xx"></div></div>
    <button style="background:#ff1744;color:white;padding:12px;width:100%;border:none;border-radius:10px;margin-top:8px;font-weight:900" onclick="doWithdraw()">WITHDRAW NOW</button>
    <p id="withdrawMsg" style="font-size:11px;margin-top:6px;text-align:center;color:#00ff88"></p>
  </div>
  <div style="margin-top:10px"><label>TRADE HISTORY</label><div id="tradeHistory" style="background:#0b0e14;padding:8px;border-radius:10px;max-height:120px;overflow:auto;font-size:11px">No trades yet</div></div>
</div>

<div class="modal" id="loginModal"><div class="modalBox"><h3>LOGIN</h3><input id="loginPhone" placeholder="Phone 07xx xxx xxx"><input id="loginPass" type="password" placeholder="Password"><button style="background:#00ff88" onclick="doLogin()">LOGIN</button><button style="background:#222;color:white" onclick="closeModals()">CANCEL</button></div></div>
<div class="modal" id="regModal"><div class="modalBox"><h3>REGISTER</h3><input id="regPhone" placeholder="Phone 07xx"><input id="regPass" type="password" placeholder="Create Password"><button style="background:#00ff88;color:#000" onclick="doRegister()">CREATE & VERIFY M-PESA</button><button style="background:#222;color:white" onclick="closeModals()">CANCEL</button><p style="font-size:10px;color:#888;margin-top:8px">We send KES 1 STK to verify M-Pesa</p></div></div>

<script>
let account='demo'; let demoBal=10000; let realBal=0; let trading=false;
let currentUser=JSON.parse(localStorage.getItem('dolavex_user')||'null');
if(currentUser){realBal=currentUser.realBal||0; demoBal=currentUser.demoBal||10000; setTimeout(()=>loggedInUI(),200);}

function getProfitPercent(){
  let type=document.getElementById('tradeType').value;
  let pred=document.getElementById('prediction').value;
  let digit=parseInt(document.getElementById('digitPick').value);
  if(type==='matches') return 80;
  if(type==='evenodd') return 70;
  if(type==='risefall') return 50;
  if(type==='overunder'){
    if(pred==='OVER'){const m={0:10,1:20,2:20,3:30,4:40,5:50,6:60,7:70,8:70,9:80}; return m[digit]??50;}
    else{const m={0:80,1:70,2:70,3:60,4:50,5:50,6:40,7:30,8:20,9:10}; return m[digit]??50;}
  }
  return 80;
}
function setAccount(t){account=t; document.getElementById('accType').innerText=t.toUpperCase(); document.getElementById('accType').style.color=t==='real'?'#ff1744':'#00c853'; if(t==='real'){document.getElementById('realBtn').className='real';document.getElementById('demoBtn').className='demo inactive';}else{document.getElementById('realBtn').className='real inactive';document.getElementById('demoBtn').className='demo';} updateReturn(); updateDash();}
function updateUI(){let t=document.getElementById('tradeType').value; let p=document.getElementById('prediction'); let r=document.getElementById('btnRise'); let f=document.getElementById('btnFall'); if(t==='risefall'){p.innerHTML='<option value="RISE">Rise</option><option value="FALL">Fall</option>';document.getElementById('digitLabel').innerText='RISE / FALL';r.innerText='RISE ⬆️';f.innerText='FALL ⬇️';}else if(t==='overunder'){p.innerHTML='<option value="OVER">Over</option><option value="UNDER">Under</option>';document.getElementById('digitLabel').innerText='OVER / UNDER';r.innerText='OVER';f.innerText='UNDER';}else if(t==='matches'){p.innerHTML='<option value="MATCHES">Matches</option><option value="DIFFERS">Differs</option>';document.getElementById('digitLabel').innerText='MATCHES / DIFFERS';r.innerText='MATCHES';f.innerText='DIFFERS';}else if(t==='evenodd'){p.innerHTML='<option value="EVEN">Even</option><option value="ODD">Odd</option>';document.getElementById('digitLabel').innerText='EVEN / ODD';r.innerText='EVEN';f.innerText='ODD';} updateReturn();}
function updateReturn(){let s=parseFloat(document.getElementById('stake').value)||100; let pct=getProfitPercent(); let ret=s+(s*pct/100); document.getElementById('returnText').innerText=`Return: KES ${ret.toFixed(0)} (${pct}%) • ${account.toUpperCase()} • BAL KES ${account==='demo'?demoBal.toFixed(0):realBal.toFixed(0)}`; document.getElementById('demoBalTxt').innerText=demoBal.toFixed(0); document.getElementById('realBalTxt').innerText=realBal.toFixed(0);}
function openModal(t){document.getElementById(t==='login'?'loginModal':'regModal').style.display='flex';}
function closeModals(){document.getElementById('loginModal').style.display='none';document.getElementById('regModal').style.display='none';}
function doRegister(){let phone=document.getElementById('regPhone').value.trim(); let pass=document.getElementById('regPass').value.trim(); if(phone.length<10||pass.length<4){alert('Enter valid phone + pass min 4');return;} let user={phone,pass,realBal:0,demoBal:10000}; localStorage.setItem('dolavex_user',JSON.stringify(user)); currentUser=user; loggedInUI(); closeModals(); alert('✅ Account created! STK verify KES 1...'); stkPush(phone,1);}
function doLogin(){let phone=document.getElementById('loginPhone').value.trim(); let pass=document.getElementById('loginPass').value.trim(); let saved=JSON.parse(localStorage.getItem('dolavex_user')||'null'); if(saved&&saved.phone===phone&&saved.pass===pass){currentUser=saved; realBal=saved.realBal||0; demoBal=saved.demoBal||10000; loggedInUI(); updateReturn(); closeModals(); alert('✅ Welcome '+phone);}else{alert('❌ Wrong phone/pass');}}
function loggedInUI(){document.getElementById('dashBtn').style.display='block'; document.getElementById('logoutBtn').style.display='block'; let u=JSON.parse(localStorage.getItem('dolavex_user')||'{}'); if(u.phone){document.getElementById('dashPhone').innerText=u.phone; document.getElementById('withdrawPhone').value=u.phone;} updateDash();}
function logout(){localStorage.removeItem('dolavex_user'); location.reload();}
function toggleDash(){let d=document.getElementById('dashboard'); d.style.display=d.style.display==='none'?'block':'none'; updateDash();}
function updateDash(){document.getElementById('dashReal').innerText='KES '+realBal.toFixed(0); document.getElementById('dashDemo').innerText='KES '+demoBal.toFixed(0);}
async function stkPush(phoneArg=null, amountArg=null){
  let ph=phoneArg||prompt('M-Pesa number 07xx:'); if(!ph)return;
  let amt=amountArg||prompt('Amount DEPOSIT KES:','500'); if(!amt)return; amt=parseFloat(amt);
  document.getElementById('msg').innerHTML=`📲 STK PUSH KES ${amt} to ${ph}... Check phone!`; document.getElementById('msg').style.color='#ffab00';
  await new Promise(r=>setTimeout(r,2000));
  realBal+=amt; updateReturn(); updateDash();
  document.getElementById('msg').innerHTML=`✅ STK SUCCESS! KES ${amt} added to REAL!`; document.getElementById('msg').style.color='#00ff88';
  let u=JSON.parse(localStorage.getItem('dolavex_user')||'{}'); u.realBal=realBal; u.demoBal=demoBal; if(!u.phone) u.phone=ph; localStorage.setItem('dolavex_user',JSON.stringify(u));
}
function doWithdraw(){let amt=parseFloat(document.getElementById('withdrawAmt').value); let ph=document.getElementById('withdrawPhone').value; if(isNaN(amt)||amt<100){alert('Min 100');return;} if(realBal<amt){alert('Insufficient REAL balance. Deposit via STK.');return;} document.getElementById('withdrawMsg').innerText=`⏳ Sending KES ${amt} to ${ph}...`; setTimeout(()=>{realBal-=amt; updateReturn(); updateDash(); document.getElementById('withdrawMsg').innerText=`✅ Withdrawal KES ${amt} sent to ${ph}! B2C simulated`; let u=JSON.parse(localStorage.getItem('dolavex_user')||'{}'); u.realBal=realBal; localStorage.setItem('dolavex_user',JSON.stringify(u));},2000);}
function addHistory(txt){let el=document.getElementById('tradeHistory'); el.innerHTML=`<div>${new Date().toLocaleTimeString()} - ${txt}</div>`+el.innerHTML;}

updateUI();
const chartEl=document.getElementById('chart');
const chart=LightweightCharts.createChart(chartEl,{layout:{background:{color:'#0b0e14'},textColor:'#555'},grid:{vertLines:{color:'#111'},horzLines:{color:'#111'}},width:chartEl.clientWidth,height:chartEl.clientHeight,rightPriceScale:{borderColor:'#222'},timeScale:{borderColor:'#222',timeVisible:true,secondsVisible:true}});
const candleSeries=chart.addCandlestickSeries({upColor:'#00ff88',downColor:'#ff1744',borderVisible:false,wickUpColor:'#00ff88',wickDownColor:'#ff1744'});
const lineSeries=chart.addLineSeries({color:'#00ff88',lineWidth:2,priceLineVisible:false,lastValueVisible:false});
let price=81212.99; let data=[]; let lineData=[]; let now=Math.floor(Date.now()/1000)-60;
for(let i=0;i<60;i++){let o=price; let c=o+(Math.random()-0.5)*8; let h=Math.max(o,c)+Math.random()*4; let l=Math.min(o,c)-Math.random()*4; let d={time:now+i,open:o,high:h,low:l,close:c}; data.push(d); lineData.push({time:d.time,value:c}); price=c;}
candleSeries.setData(data); lineSeries.setData(lineData);
function getLastDigit(p){return Math.abs(Math.floor((p*100)%10));}
async function fetchLive(){
  try{let res=await fetch('https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDT'); let j=await res.json(); price=parseFloat(j.price);}catch(e){price+=(Math.random()-0.5)*6;}
  let t=Math.floor(Date.now()/1000); let last=data[data.length-1];
  if(t===last.time){last.close=price; last.high=Math.max(last.high,price); last.low=Math.min(last.low,price); candleSeries.update(last);}
  else if(t>last.time){if((t-last.time)>=3){let nc={time:t,open:last.close,high:Math.max(last.close,price),low:Math.min(last.close,price),close:price}; data.push(nc); if(data.length>80)data.shift(); candleSeries.setData(data);}else{last.close=price; last.high=Math.max(last.high,price); last.low=Math.min(last.low,price); candleSeries.update(last);}}
  if(lineData.length===0||lineData[lineData.length-1].time!==t){lineData.push({time:t,value:price}); if(lineData.length>80)lineData.shift();}else{lineData[lineData.length-1].value=price;}
  lineSeries.setData(lineData); chart.timeScale().scrollToRealTime();
  document.getElementById('topPrice').innerText=price.toFixed(2); document.getElementById('bigPrice').innerText=price.toFixed(2); document.getElementById('lastDigit').innerText=getLastDigit(price);
}
setInterval(fetchLive,1000); fetchLive();
window.onresize=()=>chart.applyOptions({width:chartEl.clientWidth,height:chartEl.clientHeight});
function placeTrade(){
  if(trading){alert('Trade running!');return;}
  let stake=parseFloat(document.getElementById('stake').value); let type=document.getElementById('tradeType').value; let pred=document.getElementById('prediction').value; let digitPick=parseInt(document.getElementById('digitPick').value); let duration=parseInt(document.getElementById('duration').value);
  let curBal=account==='demo'?demoBal:realBal; if(curBal<stake){alert('No balance');return;}
  let pct=getProfitPercent();
  if(account==='demo')demoBal-=stake;else realBal-=stake; updateReturn(); updateDash();
  let entry=price; let entryDigit=getLastDigit(entry);
  trading=true; let box=document.getElementById('timerBox'); box.style.display='block'; let left=duration; document.getElementById('countdown').innerText=left;
  document.getElementById('msg').innerHTML=`⏳ <b style="color:#ff1744">${left}s</b> Entry ${entryDigit} (${pct}%)`; document.getElementById('msg').style.color='#ffab00';
  let timer=setInterval(()=>{
    left--; document.getElementById('countdown').innerText=left; box.style.background=left%2===0?'#ff1744':'#aa0000';
    document.getElementById('msg').innerHTML=`⏳ <b style="color:#ff1744;font-size:18px">${left}s</b> vs Live ${getLastDigit(price)} • ${pct}%`;
    if(left<=0){
      clearInterval(timer); box.style.display='none'; trading=false;
      let exit=price; let exitDigit=getLastDigit(exit); let win=false;
      if(type==='risefall'){win=(pred==='RISE'&&exit>entry)||(pred==='FALL'&&exit<entry);}
      else if(type==='overunder'){win=pred==='OVER'?exitDigit>digitPick:exitDigit<digitPick;}
      else if(type==='matches'){win=pred==='MATCHES'?exitDigit===digitPick:exitDigit!==digitPick;}
      else if(type==='evenodd'){win=pred==='EVEN'?exitDigit%2===0:exitDigit%2===1;}
      if(win){let profit=stake*pct/100; if(account==='demo')demoBal+=stake+profit;else realBal+=stake+profit; document.getElementById('msg').innerHTML=`✅ WIN! ${entryDigit}→${exitDigit} +KES ${profit.toFixed(0)} (${pct}%)`; document.getElementById('msg').style.color='#00ff88'; addHistory(`WIN ${pred} ${entryDigit}->${exitDigit} +${profit.toFixed(0)} ${pct}%`);}
      else{document.getElementById('msg').innerHTML=`❌ LOSS! ${entryDigit}→${exitDigit} -KES ${stake} (${pct}%)`; document.getElementById('msg').style.color='#ff1744'; addHistory(`LOSS ${pred} ${entryDigit}->${exitDigit} -${stake}`);}
      updateReturn(); updateDash(); let u=JSON.parse(localStorage.getItem('dolavex_user')||'{}'); u.realBal=realBal; u.demoBal=demoBal; localStorage.setItem('dolavex_user',JSON.stringify(u));
    }
  },1000);
}
setAccount('demo');
</script>
</body>
</html>
