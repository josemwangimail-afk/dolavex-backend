<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DOLAVEX V6.1 - FULL PRO</title>
<script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#0b0e14;color:white}
.top{display:flex;justify-content:space-between;padding:10px;background:#0b0e14;border-bottom:1px solid #1f2333;align-items:center;flex-wrap:wrap;gap:8px;position:relative}
.logo{color:#00ff88;font-weight:900;font-size:19px}
.switch{display:flex;background:#1a1e2e;border-radius:20px;padding:3px}
.switch button{border:none;padding:7px 12px;border-radius:16px;font-weight:900;font-size:11px;cursor:pointer}
.real{background:#ff1744;color:white}.demo{background:#00c853;color:white}.inactive{background:transparent!important;color:#888!important}
.authBtn{background:#222;color:white;border:1px solid #333;padding:7px 14px;border-radius:20px;font-size:11px;font-weight:900;cursor:pointer}
#chart{width:100%;height:42vh;background:#0b0e14}
.panel{background:#151821;margin:8px;border-radius:16px;padding:12px;border:1px solid #222}
.row{display:flex;gap:8px}.col{flex:1}
label{font-size:10px;color:#888;display:block;margin:6px 0 4px;text-transform:uppercase}
select,input{width:100%;background:#0b0e14;border:1px solid #2a2e45;color:white;padding:10px;border-radius:10px;font-size:13px}
.return{color:#00ff88;font-weight:bold;margin:8px 0;text-align:center;font-size:13px}
.actions{display:flex;gap:8px}
.rise{flex:1;background:#00c853;color:white;border:none;padding:14px;border-radius:12px;font-weight:900;cursor:pointer}
.fall{flex:1;background:#ff1744;color:white;border:none;padding:14px;border-radius:12px;font-weight:900;cursor:pointer}
.msg{text-align:center;padding:8px;font-weight:bold;min-height:32px;font-size:13px}
.livePrice{position:absolute;top:52px;left:8px;background:#000000cc;padding:5px 9px;border-radius:8px;z-index:5}
.timerBox{position:absolute;top:52px;right:8px;background:#ff1744;color:white;padding:8px 16px;border-radius:10px;z-index:10;font-weight:900;display:none;border:2px solid white;box-shadow:0 0 15px #ff1744}
.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:#000000dd;z-index:99;display:none;align-items:center;justify-content:center}
.modalBox{background:#151821;padding:20px;border-radius:16px;width:92%;max-width:380px;border:1px solid #333}
.modalBox h3{margin-bottom:12px;color:#00ff88}
.modalBox input{margin:6px 0}
.modalBox button{width:100%;margin-top:10px;padding:12px;border:none;border-radius:10px;font-weight:900;cursor:pointer}
.userMenu{position:relative;display:none}
.userBtn{background:#00ff88;color:#000;border:none;padding:8px 16px;border-radius:20px;font-weight:900;cursor:pointer;display:flex;align-items:center;gap:6px}
.dropdown{position:absolute;top:42px;right:0;background:#0f1a15;border:1px solid #00ff88;border-radius:12px;width:210px;z-index:20;display:none;overflow:hidden;box-shadow:0 10px 30px #000}
.dropdown div{padding:13px 16px;cursor:pointer;border-bottom:1px solid #1a3326;font-size:13px;font-weight:900;display:flex;justify-content:space-between;align-items:center;color:#00ff88;background:#0f1a15}
.dropdown div:hover{background:#00ff88;color:#000}
.dropdown div:last-child{border:none;color:#ff4d4d}
.dropdown div:last-child:hover{background:#ff1744;color:white}
</style>
</head>
<body>
<div class="top">
  <div class="logo">DOLAVEX</div>
  <div style="display:flex;gap:6px;align-items:center" id="landingAuth">
    <button class="authBtn" onclick="openModal('login')">LOGIN</button>
