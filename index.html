<!DOCTYPE html><html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DOLAVEX</title>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0e14;color:#ddd;font-family:system-ui}.header{background:#111827;padding:12px;display:flex;justify-content:space-between;border-bottom:1px solid #1f2937}.logo{font-weight:900;color:#00ff88;font-size:22px}#chart{height:55vh;width:100%}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px}.panel{background:#151a23;border-radius:12px;padding:12px;border:1px solid #1f2937}.btn{width:100%;padding:14px;border-radius:10px;border:none;font-weight:800}.buy{background:#00c853;color:white}.sell{background:#d50000;color:white}input{width:100%;padding:10px;background:#0a0e14;border:1px solid #2a3441;border-radius:8px;color:white;margin:6px 0}</style></head><body>
<div class="header"><div class="logo">DOLAVEX</div><div style="color:#00ff88">● LIVE <span id="price">$67432</span></div><div>BTC/USDT</div></div>
<div id="chart"></div>
<div class="controls"><div class="panel"><h4 style="color:#00c853">BUY</h4><input value="100"><button class="btn buy">BUY BTC</button></div><div class="panel"><h4 style="color:#ff1744">SELL</h4><input value="100"><button class="btn sell">SELL BTC</button></div></div>
<script>const el=document.getElementById('chart');const chart=LightweightCharts.createChart(el,{layout:{background:{color:'#0a0e14'},textColor:'#8b9bb4'},grid:{vertLines:{color:'#1a2233'},horzLines:{color:'#1a2233'}},width:el.clientWidth,height:el.clientHeight});const s=chart.addCandlestickSeries({upColor:'#00c853',downColor:'#d50000'});let d=[],base=67432,t=Math.floor(Date.now()/1000)-300*60;for(let i=0;i<300;i++){let o=base+(Math.random()-.5)*200,c=o+(Math.random()-.5)*150,h=Math.max(o,c)+80,l=Math.min(o,c)-80;d.push({time:t+i*60,open:o,high:h,low:l,close:c});base=c;}s.setData(d);setInterval(()=>{let last=d[d.length-1];let nc=last.close+(Math.random()-.5)*40;let c={time:last.time+60,open:last.close,high:Math.max(last.close,nc)+20,low:Math.min(last.close,nc)-20,close:nc};d.push(c);if(d.length>400)d.shift();s.setData(d);document.getElementById('price').innerText='$'+nc.toFixed(2);},1000);</script></body></html>
